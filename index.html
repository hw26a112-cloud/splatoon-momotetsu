<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>領域展開 スプラ桃鉄 カード管理</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0f1118;--panel:#1b202c;--panel2:#10141d;--border:#30394b;--text:#f7f8fb;--muted:#9ba4b6;--accent:#5865f2;--green:#287d51;--history:#a855f7;--gold:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.app{max-width:900px;margin:auto;padding:18px 22px 60px}.hero{padding:30px 8px 20px}
h1{font-size:clamp(28px,5vw,42px);margin:0 0 10px;font-weight:800;letter-spacing:-1px}.hero p{margin:0;color:var(--muted);font-size:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;background:var(--panel);border:2px solid var(--border);border-radius:24px;padding:18px}
.stat{background:var(--panel2);border-radius:16px;text-align:center;padding:14px 4px}.stat strong{display:block;font-size:30px}.stat span{color:var(--muted);font-size:13px}
section{background:var(--panel);border:2px solid var(--border);border-radius:24px;margin-top:20px;padding:22px}
.draw-area{display:flex;flex-direction:column;gap:12px}
.draw{width:100%;border:0;border-radius:20px;background:var(--accent);color:#fff;font-weight:800;font-size:20px;padding:20px;cursor:pointer}
.draw:active{transform:translateY(2px)}
.draw-history{background:var(--history)}
.reset-deck-btn{width:100%;border:1px solid var(--border);border-radius:16px;background:#171c27;color:#fff;font-weight:700;font-size:15px;padding:12px;cursor:pointer}
h2{margin:0 0 16px;font-size:22px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:18px;padding:15px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}.card-name{font-size:17px;font-weight:800}.badge{font-size:11px;border-radius:999px;padding:3px 7px;font-weight:800;white-space:nowrap}
.white{background:#eee;color:#222}.black{background:#292d38;color:#fff;border:1px solid #596174}.green{background:#287d51;color:#fff}.purple{background:var(--history);color:#fff}.rank-badge{background:var(--gold);color:#000;font-weight:900}
.card-desc{color:#b5bdca;font-size:13px;line-height:1.5;margin-top:8px;white-space:pre-wrap;}.copies{color:#8e98ab;font-size:12px;margin-top:8px}.card-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.small,.primary,.danger,.swap-btn{border:1px solid var(--border);background:#171c27;color:#fff;border-radius:12px;padding:8px 10px;cursor:pointer;font-size:12px}.primary{background:var(--accent);border:0;font-weight:700}.danger{background:#7c3040;border:0}.swap-btn{background:#d97706;border:0;font-weight:700}
.empty{color:var(--muted);padding:10px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#fff;color:#111;padding:12px 17px;border-radius:14px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}

.points-panel{display:flex;flex-direction:column;gap:8px;}
.points-value{font-size:48px;font-weight:900;line-height:1;word-break:break-all}
.points-label{color:var(--muted);font-size:14px;margin-top:4px}
.point-reset{margin-top:10px;width:100%}

details summary{cursor:pointer;font-weight:800;font-size:18px;list-style:none}
.deck-view-container{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}

.reset-all-container{margin-top:30px;padding:22px;background:#241216;border:2px solid #7c3040;border-radius:24px;text-align:center}
.reset-all-btn{width:100%;border:0;border-radius:18px;background:#b91c1c;color:#fff;font-weight:800;font-size:18px;padding:18px;cursor:pointer;transition:.2s}
.reset-all-btn:active{transform:scale(0.98)}

.room-box{display:flex;flex-direction:column;gap:12px}
.room-inputs{display:flex;gap:8px}
.room-status-bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.room-status{font-weight:700;color:var(--accent);font-size:15px}
.turn-control-box{background:var(--panel2);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.turn-display{font-size:22px;font-weight:900;color:var(--gold)}
.turn-btn-group{display:flex;gap:8px}
.turn-end-btn{background:var(--accent);color:#fff;font-weight:800;font-size:16px;border:0;border-radius:12px;padding:10px 18px;cursor:pointer}
.turn-end-btn:disabled{opacity:0.4;cursor:not-allowed;background:#444!important}

.match-control-box{display:flex;gap:10px;margin-top:10px}
.match-btn{flex:1;border:0;border-radius:12px;padding:12px;font-weight:800;font-size:15px;cursor:pointer;color:#fff}
.match-btn:disabled{opacity:0.4;cursor:not-allowed;background:#444!important}
.btn-match-start{background:#16a34a}
.btn-match-end{background:#dc2626}

.predict-box{background:var(--panel2);border:1px solid var(--border);border-radius:16px;padding:14px;margin-top:10px;display:flex;flex-direction:column;gap:12px}
.input-row{display:flex;align-items:center;gap:10px}
.input-row label{font-size:14px;font-weight:800;width:90px;color:var(--muted)}
.input-row input{flex:1;background:var(--bg);border:1px solid var(--border);color:#fff;padding:10px 12px;border-radius:10px;font-size:16px;font-weight:800}
.input-row input:disabled{opacity:0.5;background:#181c24;cursor:not-allowed}
.confirm-kill-btn{background:var(--gold);color:#000;border:0;border-radius:10px;padding:10px;font-weight:900;font-size:14px;cursor:pointer;width:100%}
.confirm-kill-btn:disabled{opacity:0.5;cursor:not-allowed;background:#555;color:#888}

.peer-card{background:var(--panel2);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.peer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:8px}
.peer-name{font-weight:800;font-size:18px}.peer-pts{background:var(--accent);padding:4px 10px;border-radius:10px;font-size:14px;font-weight:800}
.peer-predict-tag{background:var(--panel);border:1px solid var(--border);color:var(--gold);padding:2px 8px;border-radius:6px;font-size:12px;font-weight:800;margin-left:6px;}
.peer-section-title{font-size:12px;color:var(--muted);margin:8px 0 4px;font-weight:700}
.peer-hand-list{display:flex;flex-wrap:wrap;gap:8px}
.mini-card{background:var(--panel);border:1px solid var(--border);padding:6px 10px;border-radius:8px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}

.judge-box{margin-top:10px;padding-top:8px;border-top:1px dashed var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.status-badge{font-size:13px;font-weight:900;padding:4px 10px;border-radius:6px;display:none}
.status-badge.success{display:inline-block;background:#16a34a;color:#fff}
.status-badge.failure{display:inline-block;background:#dc2626;color:#fff}

.log-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.log-box{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:12px;max-height:180px;overflow-y:auto;font-size:13px;line-height:1.6;color:#d1d5db}
.log-item{border-bottom:1px solid #232936;padding:4px 0}.log-item:last-child{border:0}
.log-time{color:var(--muted);font-size:11px;margin-right:6px}

@media(max-width:600px){.app{padding:12px 15px 45px}.stats{padding:12px;gap:6px}.room-inputs{flex-direction:column}.turn-control-box{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div class="app">
<header class="hero"><h1>領域展開 スプラ桃鉄 カード管理</h1><p>スマホ向け・リアルタイム対戦対応</p></header>

<section>
  <h2>🌐 リアルタイム対戦ルーム</h2>
  <div class="room-box">
    <div>
      <input id="playerNameInput" placeholder="あなたの名前（例: プレイヤー1）" style="margin-bottom:8px">
    </div>
    <div class="room-inputs">
      <button class="primary" id="createRoomBtn" style="flex:1">ルームを作成する</button>
      <input id="roomCodeInput" placeholder="6桁のコードを入力" style="flex:1">
      <button class="small" id="joinRoomBtn">参加</button>
    </div>
    
    <div class="turn-control-box">
      <div class="turn-display">⏳ ターン: <span id="currentTurnVal">1</span></div>
      <div class="turn-btn-group">
        <button class="turn-end-btn" id="turnEndBtn" disabled>ターン終了</button>
        <button class="small danger" id="resetTurnBtn">ターンを1に戻す</button>
      </div>
    </div>

    <div class="predict-box">
      <div class="input-row">
        <label for="predictInput">🎯 予想数値</label>
        <input type="number" id="predictInput" placeholder="数値を入力">
      </div>

      <div class="match-control-box">
        <button class="match-btn btn-match-start" id="matchStartBtn" disabled>▶ 試合開始（全員の予想完了待ち）</button>
        <button class="match-btn btn-match-end" id="matchEndBtn" disabled>⏹ 試合終了</button>
      </div>

      <div class="input-row">
        <label for="killInput">⚔️ キル数</label>
        <input type="number" id="killInput" placeholder="試合終了後に開放" value="0" disabled>
      </div>
      <button type="button" class="confirm-kill-btn" id="confirmKillBtn" disabled>キル数を確定してポイント計算</button>
    </div>

    <div class="room-status-bar">
      <div id="roomStatus" class="room-status">未接続（ソロモード）</div>
      <button class="danger" id="leaveRoomBtn" style="display:none;">退室する</button>
    </div>
  </div>
</section>

<section id="otherPlayersSection" style="display:none;">
  <h2>👥 全員の所持カード・歴史ヒーロー・ポイント（順位）</h2>
  <div id="otherPlayersList"></div>
</section>

<section style="margin-top:20px;">
  <details open>
    <summary>
      <div class="log-header">
        <span>📜 試合ログ（タップで折りたたみ）</span>
        <button class="small danger" id="clearLogBtn" style="font-size:11px;padding:4px 8px;">ログをクリア</button>
      </div>
    </summary>
    <div class="log-box" id="gameLog">
      <div class="log-item"><span class="log-time">---</span> ログがここに表示されます</div>
    </div>
  </details>
</section>

<div class="stats" style="margin-top:20px;">
  <div class="stat"><strong id="handCount">0</strong><span>手札</span></div>
  <div class="stat"><strong id="deckCount">0</strong><span>山札</span></div>
  <div class="stat"><strong id="usedCount">0</strong><span>使用済み</span></div>
  <div class="stat"><strong id="discardedCount">0</strong><span>破棄</span></div>
</div>

<section>
  <h2>⭐ ポイント管理（現在の順位: <span id="myRankDisplay" style="color:var(--gold);">1位</span>）</h2>
  <div class="points-panel">
    <div>
      <div class="points-value" id="pointsValue">0</div>
      <div class="points-label">現在の所持ポイント</div>
    </div>
  </div>
  <button type="button" class="small point-reset" id="resetPoints">ポイントを0に戻す</button>
</section>

<section>
  <div class="draw-area">
    <button class="draw" id="drawBtn">🎴 山札からランダムに引く</button>
    <button class="reset-deck-btn" id="resetDeckMainBtn">🔄 山札をリセット（手札・使用済み・破棄を全て山札へ戻す）</button>
  </div>
</section>

<section>
  <details>
    <summary>▶ 📦 山札の中身を確認・ゲットする</summary>
    <div id="deckView" class="deck-view-container"></div>
  </details>
</section>

<section><h2>🃏 自分の手札</h2><div id="hand" class="cards"></div></section>

<section>
  <h2>🏛️ 歴史ヒーロー</h2>
  <div class="draw-area">
    <button class="draw draw-history" id="drawHistoryBtn">📜 歴史ヒーローカードを引く（要 10pt / 残り: <span id="historyDeckCount">0</span>枚）</button>
    <button class="reset-deck-btn" id="resetHistoryDeckBtn">🔄 歴史ヒーローをリセット（捨てたカードを含め全て山札へ戻す）</button>
  </div>
  <div style="margin-top:16px;">
    <h3>所持している歴史ヒーロー</h3>
    <div id="historyHand" class="cards"></div>
  </div>
</section>

<div class="reset-all-container">
  <button class="reset-all-btn" id="resetAllBtn">💥 全てを一括リセット（ポイント0・全手札・歴史ヒーロー・ターン数初期化）</button>
</div>

</div><div id="toast" class="toast"></div>

<script>
const KEY="splatoon_momotetsu_card_manager_v24";

const cards=[
["とっかえっこカード","白","自分の持ち点と、他の人の持ち点を入れ替える",1],
["2倍カード","白","次の試合での獲得ポイント×2（マイナスの場合も）",3],
["シャッフルカード","白","全員の持ち点がランダムに入れ替わる",2],
["徳政令カード","白","全員のうち、持ち点がマイナスの人は持ち点が0になる",3],
["たいらのまさかカード","白","全員の持ち点を足して、全員が同じ持ち点になるように分ける",2],
["持ち金ゼロカード","白","自分または選んだ人の持ち点が0円になる（1/2の確率で失敗）",1],
["とりかえしカード","黒","入手した次の試合で±2をクリアできなかった場合、持ち点が半分になる。（持ち点がマイナスの場合は持ち点2倍）",1],
["デビルカード","黒","毎ターン持ち点が1減る（以降の試合で±2をクリアすると消える）",2],
["キングデビルカード","黒","毎ターン持ち点が3減る（以降の試合で±2をクリアすると消える）",1],
["武器エラベルカード","白","次の試合で使える武器を自分で選べる",3],
["武器指定カード","白","選んだ人の武器を選べる",2],
["刀狩りカード","白","誰か一人を選び、持っているカードを一枚奪う",1],
["カード交換カード","白","選んだ人と一枚カードを交換する（カードは選べる）",2],
["リニアカード","白","次の試合での獲得ポイント×10（マイナスの場合も）",1],
["縛りカード","黒","入手した次のターン、縛りルーレットに従う（終わったら捨てる）",1],
["スリの銀次","黒","入手時にルーレットを引いてその分マイナス",1],
["シュレッダーカード","白","自身が持っているカードを一つ捨てることができる",2],
["へっちゃらカード","白","次の試合、マイナスにならなくなる",2],
["武器引き直しカード","白","武器を引き直すことができる",3],
["-20or+20カード","白","1/2の確率で+20か-20になる",2],
["-2倍カード","白","選んだ人の次の試合の獲得ポイントを-2倍にすることができる",1],
["ギア指定カード","白","武器ルーレットを引く前に選んだ人のギアを選ぶことができる",3],
["破壊カード","白","選んだ人のカードを1枚破壊できる",2],
["最下位カード","緑","最下位で使うと何かが起きる（最下位でのみ使用可能）",2],
["牛歩カード","黒","入手した次の試合の最高取得ポイントが1になる",1],
["千載一遇カード","白","ランダムに出た1～9の数字分取得ポイントの条件が緩和される",2]
].map(x=>({id:crypto.randomUUID(),name:x[0],color:x[1],desc:x[2],copies:x[3],img:x[4]||""}));

const historyCards=[
["かわらばやし","紫","・毎ターン行動できる。ランダムでポイントを獲得できる(1、3、5ポイントの中から)\n・クビ：これを引くと所持ポイントが0になるかつ、かわらばやしが消える",1],
["アブドラ","紫","・自分が引いた悪いカードの効果を 50% の確率で無効化できる",1],
["日野社長","紫","・毎ターン 50% の確率でカードを生み出す",1],
["ヤラセさん","紫","・毎試合後 50% の確率で失敗をなかったことにできる",1],
["トゲニャン","紫","・相手から受ける悪いカードの効果を 50% の確率で無効化する（無効化できた時はその効果を跳ね返す）",1],
["カクさん","紫","・毎試合後 50% の確率で発動する。失敗時、マイナスになった分のポイントの半分を自分以外の全プレイヤーに付与する",1],
["クーパー","紫","・毎ターン発動可能、自身を除く他のプレイヤー1人をランダムに自身と同じ合計ポイントにする\n・発動後、このカードは消える\n・9ターン目の終わりまで発動されなかった場合強制的に能力を発動させる",1],
["マッスル","紫","・毎ターン 50% の確率で発動する。このカードが発動した時、プレイヤーの合計ポイントが 1、2 位の時、徳政令カードをドローする。プレイヤーの合計ポイントが 3、4 位の時、千載一遇カードをドローする。\n・10ターン目終了かつ、このカードを所持しているプレイヤーの合計ポイントが最下位の時、とっかえカードをドローする",1],
["パンデミック","紫","・毎試合後 50% の確率で発動する。自分を除く他のプレイヤーが失敗した時、そのポイントを 2 倍にする",1],
["深田えいみ","紫","・毎ターン 50% の確率で発動する。自分を除く、他のプレイヤーが歴史ヒーローを所持している時、ランダムなプレイヤーから歴史ヒーローを寝取る\n・寝取り後、このカードは消える",1],
["堀大輔","紫","・毎ターン発動する。起きる/寝るのルーレットを引くことができる\n・初期堀ポイントは 1\n(寝た場合) 現在所持している堀ポイントを 3 倍する\n(起きた場合) 現在所持している堀ポイントを獲得できる\n・連続して 3 ターン起きた場合、このカードは消える",1],
["いまい らちお","紫","毎試合後 50% の確率で成功した時のポイントを 2 倍にする",1],
["黒いイケメン犬","紫","・毎ターン 50% の確率で発動する。自分はランダムなカードをドローすることができるかつ、自分を除く他プレイヤー1人にキングデビルカードをドローさせる",1]
].map(x=>({id:crypto.randomUUID(),name:x[0],color:x[1],desc:x[2],copies:x[3],img:x[4]||""}));

let turnCount = 1;
let currentPrediction = null;
let isPredictionReady = false; 
let isMatchStarted = false; 
let horiPoints = 1;
let horiWakeStreak = 0;

function makeInitial(){
  let deck=[]; cards.forEach(c=>{for(let i=0;i<c.copies;i++)deck.push(c.id)});
  let historyDeck=[]; historyCards.forEach(c=>{for(let i=0;i<c.copies;i++)historyDeck.push(c.id)});
  return{cards,historyCards,deck,historyDeck,hand:[],historyHand:[],historyDiscarded:[],used:[],discarded:[],points:0,name:"",historyStatus:{},turnResult:""}
}

let state=load();
function load(){
  try{
    let s=JSON.parse(localStorage.getItem(KEY));
    if(s&&s.cards){
      if(typeof s.points!=="number"||!Number.isFinite(s.points))s.points=0;
      if(!Array.isArray(s.discarded))s.discarded=[];
      if(!Array.isArray(s.historyDeck)) s.historyDeck = historyCards.map(c=>c.id);
      if(!Array.isArray(s.historyHand)) s.historyHand = [];
      if(!Array.isArray(s.historyDiscarded)) s.historyDiscarded = [];
      if(!s.historyStatus) s.historyStatus = {};
      if(!s.turnResult) s.turnResult = "";
      s.historyCards = historyCards;
      return s;
    }
  }catch(e){}
  return makeInitial();
}

function save(){localStorage.setItem(KEY,JSON.stringify(state));render();broadcastState();}
function getCard(id){return state.cards.find(c=>c.id===id) || state.historyCards.find(c=>c.id===id)}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2000)}
function cls(c){return c==="白"?"white":c==="黒"?"black":c==="紫"?"purple":"green"}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function addLog(msg, isBroadcast = true) {
  let now = new Date();
  let timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0') + ':' + now.getSeconds().toString().padStart(2, '0');
  let container = document.getElementById("gameLog");
  let item = document.createElement("div");
  item.className = "log-item";
  item.innerHTML = `<span class="log-time">[${timeStr}]</span> ${esc(msg)}`;
  container.prepend(item);

  if (isBroadcast) {
    broadcastLog(msg);
  }
}

function clearLogUI() {

function checkAllPredictionsReady() {
  if (isMatchStarted) return;

  let allReady = isPredictionReady;
  Object.keys(otherStates).forEach(k => {
    if (!otherStates[k].isPredictionReady) {
      allReady = false;
    }
  });

  let matchStartBtn = document.getElementById("matchStartBtn");
  if (allReady) {
    matchStartBtn.disabled = false;
    matchStartBtn.textContent = "▶ 試合開始（全員入力完了！）";
  } else {
    matchStartBtn.disabled = true;
    matchStartBtn.textContent = "▶ 試合開始（全員の予想完了待ち）";
  }
}

document.getElementById("confirmKillBtn").onclick = () => {
  if (currentPrediction === null) {
    let pVal = parseInt(document.getElementById("predictInput").value, 10);
    currentPrediction = isNaN(pVal) ? 0 : pVal;
  }

  let kills = parseInt(document.getElementById("killInput").value, 10);
  if (isNaN(kills)) kills = 0;

  let diff = kills - currentPrediction;
  let absPredict = Math.abs(currentPrediction);
  let myName = document.getElementById("playerNameInput").value.trim() || "プレイヤー";

  let myHistoryCards = state.historyHand.map(id => getCard(id)).filter(Boolean);
  
  let imaiCard = myHistoryCards.find(c => c.name === "いまい らちお");
  let imaiActive = (imaiCard && state.historyStatus[imaiCard.id] === "発動準備");

  let yaraseCard = myHistoryCards.find(c => c.name === "ヤラセさん");
  let yaraseActive = (yaraseCard && state.historyStatus[yaraseCard.id] === "発動準備");

  let kakuCard = myHistoryCards.find(c => c.name === "カクさん");
  let kakuActive = (kakuCard && state.historyStatus[kakuCard.id] === "発動準備");

  if (diff < 0) {
    let loss = absPredict;
    if (yaraseActive) {
      loss = 0;
      addLog(`🎬 【ヤラセさん効果発動】失敗をなかったことにしました！（減算0pt）`);
      toast(`🎬 ヤラセさん効果：減算回避！`);
    }

    changePoints(-loss);
    state.turnResult = "failure";
    addLog(`⚔️ ${myName}: キル数(${kills}) - 予想(${currentPrediction}) = ${diff} [マイナス] ➔ ${loss}pt 減算 [失敗]（現在: ${state.points}pt）`);

    if (kakuActive && absPredict > 0) {
      let spreadPts = Math.floor(absPredict / 2);
      if (spreadPts > 0) {
        addLog(`📜 【カクさん効果発動】失敗によりマイナス分(${absPredict}pt)の半分(${spreadPts}pt)を他プレイヤー全員に付与します！`);
        toast(`📜 カクさん：他プレイヤーに +${spreadPts}pt 付与`);
        Object.keys(otherStates).forEach(peerId => {
          if (conns[peerId] && conns[peerId].open) {
            let p = otherStates[peerId];
            let currPts = p ? (p.points || 0) : 0;
            conns[peerId].send({ type: 'set_points', points: currPts + spreadPts });
          }
        });
      }
    }

    Object.keys(otherStates).forEach(peerId => {
      if (conns[peerId] && conns[peerId].open) {
        conns[peerId].send({ type: 'player_failed_notify', name: myName, lossPts: loss });
      }
    });

    toast(`キル数不足により -${loss}pt！ 【失敗】`);
  } else {
    let earned = absPredict;
    if (imaiActive) {
      earned *= 2;
      addLog(`🐟 【いまい らちお効果発動】成功ポイントが2倍(${earned}pt)になりました！`);
    }
    changePoints(earned);
    state.turnResult = "success";
    addLog(`⚔️ ${myName}: キル数(${kills}) - 予想(${currentPrediction}) = +${diff} [プラス] ➔ +${earned}pt 加算 [成功]（現在: ${state.points}pt）`);
    toast(`予想達成！ +${earned}pt 獲得！ 【成功】`);
  }

  myHistoryCards.forEach(c => {
    if (["パンデミック", "ヤラセさん", "いまい らちお", "カクさん"].includes(c.name)) {
      delete state.historyStatus[c.id];
    }
  });

  document.getElementById("turnEndBtn").disabled = false;
  document.getElementById("confirmKillBtn").disabled = true;

  save();
};

function addCardByName(cardName) {
  let targetDef = cards.find(c => c.name === cardName);
  if (targetDef) {
    state.hand.push(targetDef.id);
    save();
    render();
    let myName = document.getElementById("playerNameInput").value.trim() || "自分";
    addLog(`🎴 ${myName} が「${cardName}」を獲得しました。`);
    toast(`🎴 「${cardName}」を手札に追加しました！`);
  }
}

function getMyRank(){
  let all = [{ peerId: 'me', points: state.points }];
  Object.keys(otherStates).forEach(k => {
    all.push({ peerId: k, points: otherStates[k].points || 0 });
  });
  all.sort((a, b) => b.points - a.points);
  let myIndex = all.findIndex(item => item.peerId === 'me');
  let rank = myIndex + 1;
  let totalPlayers = all.length;
  let isLowest = (myIndex === totalPlayers - 1);
  return { rank, totalPlayers, isLowest };
}

let peer=null, conns={}, otherStates={};
function initPeer(customId=null){
  if(peer) leaveRoom();
  peer = customId ? new Peer(customId) : new Peer();
  peer.on('open', id => {
    if(customId){
      document.getElementById("roomStatus").textContent = `🏠 ルーム作成中 | コード: ${id.replace('spla-momo-','')}`;
      document.getElementById("otherPlayersSection").style.display="block";
      document.getElementById("leaveRoomBtn").style.display="inline-block";
      addLog("🏠 ルームを作成しました。コード: " + id.replace('spla-momo-',''), false);
    }
  });
  peer.on('connection', conn => {
    setupConn(conn);
  });
}

function connectToPeer(targetPeerId){
  if(targetPeerId === peer.id || conns[targetPeerId]) return;
  let conn = peer.connect(targetPeerId);
  setupConn(conn);
}

function setupConn(conn){
  conn.on('open', () => {
    conns[conn.peer] = conn;
    let currentPeers = Object.keys(conns).concat([peer.id]);
    conn.send({ type: 'peer_list', peers: currentPeers });
    conn.send({ type: 'update_turn', turn: turnCount });
    broadcastState();
  });

  conn.on('data', data => {
    if(data.type === 'peer_list') {
      (data.peers || []).forEach(pId => {
        if(pId !== peer.id && !conns[pId]){
          connectToPeer(pId);
        }
      });
      return;
    }
    if(data.type === 'update_turn') {
      setTurn(data.turn, false);
      return;
    }
    if(data.type === 'trigger_match_start') {
      executeMatchStart(data.name);
      return;
    }
    if(data.type === 'trigger_match_end') {
      executeMatchEnd(data.name);
      return;
    }
    if(data.type === 'set_points') {
      state.points = data.points;
      save();
      toast(`⚡ ポイントが ${data.points}pt に変更されました！`);
      return;
    }
    if(data.type === 'add_card_directly') {
      addCardByName(data.cardName);
      toast(`😈 手札に「${data.cardName}」が追加されました！`);
      return;
    }
    if(data.type === 'player_failed_notify') {
      let myHistory = state.historyHand.map(id => getCard(id)).filter(Boolean);
      let pandemicCard = myHistory.find(c => c.name === "パンデミック");
      if (pandemicCard && state.historyStatus[pandemicCard.id] === "発動準備") {
        if (data.lossPts > 0) {
          let extraLoss = data.lossPts; 
          addLog(`MB 【パンデミック発動！】 ${data.name} の失敗ペナルティを2倍にし、さらに -${extraLoss}pt を追い討ち！`);
          toast(`MB パンデミック発動！ ${data.name} のマイナスを2倍化！`);
          if (conns[conn.peer] && conns[conn.peer].open) {
            let curr = otherStates[conn.peer]?.points || 0;
            conns[conn.peer].send({ type: 'set_points', points: curr - extraLoss });
          }
        }
      }
      return;
    }
    if(data.type === 'steal_history') {
      let targetName = data.cardName;
      let targetCard = state.historyHand.map(id => getCard(id)).find(c => c && c.name === targetName);
      if (targetCard) {
        let idx = state.historyHand.indexOf(targetCard.id);
        if (idx >= 0) {
          state.historyHand.splice(idx, 1);
          state.historyDiscarded.push(targetCard.id);
          save();
        }
      }
      return;
    }
    if(data.type === 'log') {
      addLog(data.msg, false);
      return;
    }
    if(data.type === 'history_notify') {
      toast(`📜 ${data.name} が「${data.cardName}」を使用！ ${data.detail}`);
      return;
    }
    
    otherStates[conn.peer] = data;
    checkAllPredictionsReady();
    renderOtherPlayers();
    render();
  });

  conn.on('close', () => {
    delete conns[conn.peer];
    delete otherStates[conn.peer];
    checkAllPredictionsReady();
    renderOtherPlayers();
    render();
  });

  conn.on('error', () => {
    delete conns[conn.peer];
    delete otherStates[conn.peer];
    checkAllPredictionsReady();
    renderOtherPlayers();
    render();
  });
}

function broadcastState(){
  if(!peer) return;
  let myName = document.getElementById("playerNameInput").value.trim() || "匿名プレイヤー";
  let myHandCards = state.hand.map(id => getCard(id)).filter(Boolean).map(c => ({name: c.name, color: c.color}));
  let myHistoryCards = state.historyHand.map(id => {
    let c = getCard(id);
    if(!c) return null;
    let st = state.historyStatus[id] ? `【${state.historyStatus[id]}】` : '';
    return {id: c.id, name: c.name + st, color: c.color};
  }).filter(Boolean);
  
  let payload = { 
    peerId: peer.id, 
    name: myName, 
    points: state.points, 
    prediction: currentPrediction, 
    isPredictionReady: isPredictionReady,
    hand: myHandCards, 
    historyHand: myHistoryCards, 
    turnResult: state.turnResult 
  };
  
  Object.values(conns).forEach(c => {
    if(c && c.open) c.send(payload);
  });
}

function broadcastTurn(){
  Object.values(conns).forEach(c => {
    if(c && c.open) c.send({ type: 'update_turn', turn: turnCount });
  });
}

function setTurn(newTurn, shouldBroadcast = true) {
  let oldTurn = turnCount;
  turnCount = newTurn;
  document.getElementById("currentTurnVal").textContent = turnCount;

  if (oldTurn === 9 && turnCount === 10) {
    let cooperCard = state.historyHand.map(id => getCard(id)).find(c => c && c.name === "クーパー");
    if (cooperCard) {
      let peerKeys = Object.keys(otherStates);
      if (peerKeys.length > 0) {
        let targetPeerId = peerKeys[Math.floor(Math.random() * peerKeys.length)];
        let targetName = otherStates[targetPeerId]?.name || "プレイヤー";
        if (conns[targetPeerId] && conns[targetPeerId].open) {
          conns[targetPeerId].send({ type: 'set_points', points: state.points });
          addLog(`🌀 【クーパー9ターン目強制発動】${targetName} のポイントを自分と同じ(${state.points}pt)に統一しました！`);
          toast(`🌀 クーパー(9ターン終了)：${targetName} のポイントを強制統一！`);
        }
      }
    }
  }

  isMatchStarted = false;
  currentPrediction = null;
  isPredictionReady = false;
  document.getElementById("predictInput").value = "";

  document.getElementById("turnEndBtn").disabled = true;
  document.getElementById("predictInput").disabled = false;
  document.getElementById("killInput").disabled = true;
  document.getElementById("confirmKillBtn").disabled = true;
  document.getElementById("matchEndBtn").disabled = true;
  document.getElementById("killInput").value = "0";

  checkAllPredictionsReady();

  state.turnResult = "";
  Object.keys(otherStates).forEach(k => {
    if(otherStates[k]) otherStates[k].turnResult = "";
  });

  if(shouldBroadcast) {
    broadcastTurn();
    let myName = document.getElementById("playerNameInput").value.trim() || "プレイヤー";
    addLog(`⏳ ${myName} の操作で全員が第${turnCount}ターンへ進みました。`);
  }

  save();
}

function leaveRoom(){
  Object.values(conns).forEach(c => { if(c) c.close(); });
  conns = {};
  otherStates = {};
  if(peer){ peer.destroy(); peer = null; }
  document.getElementById("roomStatus").textContent = "未接続（ソロモード）";
  document.getElementById("otherPlayersSection").style.display = "none";
  document.getElementById("leaveRoomBtn").style.display = "none";
  toast("ルームから退室しました");
}

document.getElementById("createRoomBtn").onclick = () => {
  let code = Math.random().toString(36).substring(2, 8).toUpperCase();
  initPeer('spla-momo-' + code);
  toast("ルームを作成しました");
};

document.getElementById("joinRoomBtn").onclick = () => {
  let code = document.getElementById("roomCodeInput").value.trim().toUpperCase();
  if(!code){ toast("コードを入力してください"); return; }
  leaveRoom();
  peer = new Peer();
  peer.on('open', () => {
    connectToPeer('spla-momo-' + code);
    document.getElementById("roomStatus").textContent = `✅ ルームに参加中 (${code})`;
    document.getElementById("otherPlayersSection").style.display="block";
    document.getElementById("leaveRoomBtn").style.display="inline-block";
    let myName = document.getElementById("playerNameInput").value.trim() || "新プレイヤー";
    addLog(`👥 ${myName} がルームに参加しました。`);
    toast("ルームに参加しました");
  });
};

document.getElementById("leaveRoomBtn").onclick = () => leaveRoom();

document.getElementById("turnEndBtn").onclick = () => {
  setTurn(turnCount + 1, true);
  toast(`ターン終了！全員が第${turnCount}ターンへ進みました`);
};

document.getElementById("resetTurnBtn").onclick = () => {
  setTurn(1, true);
  let myName = document.getElementById("playerNameInput").value.trim() || "プレイヤー";
  addLog(`🔄 ${myName} が全員のターンを1にリセットしました。`);
  toast("全員のターンを1にリセットしました");
};

function renderOtherPlayers(){
  let container = document.getElementById("otherPlayersList");
  container.innerHTML = "";

  let all = [{ 
    peerId: 'me', 
    name: document.getElementById("playerNameInput").value.trim() || "自分", 
    points: state.points, 
    prediction: currentPrediction, 
    hand: state.hand.map(id => getCard(id)).filter(Boolean), 
    historyHand: state.historyHand.map(id => getCard(id)).filter(Boolean), 
    turnResult: state.turnResult 
  }];
  
  Object.keys(otherStates).forEach(k => {
    let p = otherStates[k];
    all.push({ 
      peerId: k, 
      name: p.name || "プレイヤー", 
      points: p.points || 0, 
      prediction: p.prediction, 
      hand: p.hand||[], 
      historyHand: p.historyHand||[], 
      turnResult: p.turnResult||"" 
    });
  });

  all.sort((a, b) => b.points - a.points);

  all.forEach(p => {
    let rank = all.findIndex(item => item.peerId === p.peerId) + 1;

    let cardHtml = (p.hand||[]).map(c => `<span class="mini-card"><span class="badge ${cls(c.color)}">${c.color}</span> ${esc(c.name)}</span>`).join("");
    let historyHtml = (p.historyHand||[]).map(c => `<span class="mini-card"><span class="badge ${cls(c.color)}">${c.color}</span> ${esc(c.name)}</span>`).join("");
    
    let successClass = p.turnResult === 'success' ? 'success' : '';
    let failureClass = p.turnResult === 'failure' ? 'failure' : '';

    let predictText = (p.prediction !== null && p.prediction !== undefined) ? `<span class="peer-predict-tag">🎯 予想: ${p.prediction}</span>` : '';

    let el = document.createElement("div");
    el.className = "peer-card";
    el.innerHTML = `
      <div class="peer-header">
        <span class="peer-name">👤 ${esc(p.name)} <span class="badge rank-badge">${rank}位</span> ${predictText}</span>
        <span class="peer-pts">${p.points} pt</span>
      </div>
      <div class="peer-section-title">🃏 通常手札</div>
      <div class="peer-hand-list">${cardHtml || '<span class="empty">手札なし</span>'}</div>
      <div class="peer-section-title">📜 歴史ヒーロー</div>
      <div class="peer-hand-list">${historyHtml || '<span class="empty">所持なし</span>'}</div>
      <div class="judge-box">
        <div>判定結果:</div>
        <div>
          <span class="status-badge success ${successClass}">SUCCESS (成功)</span>
          <span class="status-badge failure ${failureClass}">FAILED (失敗)</span>
        </div>
      </div>
    `;
    container.appendChild(el);
  });
}

function handleHistoryAction(card){
  let myName = document.getElementById("playerNameInput").value.trim() || "自分";

  if(card.name === "かわらばやし"){
    executeKawarabayashi(card.id);
  } else if(card.name === "アブドラ" || card.name === "トゲニャン"){
    let res = Math.random() < 0.5 ? "成功" : "失敗";
    state.historyStatus[card.id] = res;
    broadcastHistoryUse(card.name, `判定結果: 【${res}】`);
    toast(`${card.name}：【${res}】`);
    save();
  } else if(card.name === "クーパー"){
    let keys = Object.keys(otherStates);
    if(!keys.length){
      toast("クーパー：ルーム内に自分以外のプレイヤーがいません");
      return;
    }
    let targetPeerId = keys[Math.floor(Math.random() * keys.length)];
    let targetName = otherStates[targetPeerId]?.name || "プレイヤー";
    
    let conn = conns[targetPeerId];
    if(conn && conn.open){
      conn.send({ type: 'set_points', points: state.points });
      broadcastHistoryUse("クーパー", `${targetName} のポイントを自分と同じ(${state.points}pt)に変更！`);
      toast(`クーパー発動！ ${targetName} のポイントを自分と同じ(${state.points}pt)にしました！`);
    } else {
      toast("通信エラー：対象のプレイヤーへ送信できませんでした");
    }
    save();
  } else {
    broadcastHistoryUse(card.name, "の効果を発動！");
    toast("歴史ヒーロー「" + card.name + "」を発動しました");
  }
}

function executeKawarabayashi(cardId) {
  const pool = [
    ...Array(10).fill(1),
    ...Array(8).fill(3),
    ...Array(3).fill(5),
    ...Array(1).fill("クビ")
  ];
  
  const result = pool[Math.floor(Math.random() * pool.length)];

  if (result === "クビ") {
    state.points = 0;
    delete state.historyStatus[cardId];
    let idx = state.historyHand.indexOf(cardId);
    if (idx >= 0) {
      state.historyHand.splice(idx, 1);
      state.historyDiscarded.push(cardId);
    }
    broadcastHistoryUse("かわらばやし", "【クビ】が出ました！ポイントが0になり消滅！");
    toast("💥 かわらばやし：【クビ】が出ました！ポイントが0になり、かわらばやしが消滅しました");
  } else {
    state.points += result;
    broadcastHistoryUse("かわらばやし", `【${result}pt】を獲得！ (+${result}pt)`);
    toast(`🎲 かわらばやし：【${result}pt】を獲得！ (+${result}pt)`);
  }
  save();
}

function swapHistoryCard(targetHistoryId) {
  if (state.points < 10) {
    toast("ポイントが足りません（10pt以上が必要）");
    return;
  }
  if (!state.hand.length) {
    toast("交換するための通常手札がありません");
    return;
  }
  if (!state.historyDeck.length) {
    toast("引き直す歴史ヒーローの山札がありません");
    return;
  }

  let oldCard = getCard(targetHistoryId);
  state.points -= 10;
  delete state.historyStatus[targetHistoryId];
  let hIdx = state.historyHand.indexOf(targetHistoryId);
  if (hIdx >= 0) {
    state.historyHand.splice(hIdx, 1);
    state.historyDiscarded.push(targetHistoryId);
  }

  let randIndex = Math.floor(Math.random() * state.hand.length);
  let discardedId = state.hand.splice(randIndex, 1)[0];
  state.discarded.push(discardedId);

  let newHIndex = Math.floor(Math.random() * state.historyDeck.length);
  let newHistoryId = state.historyDeck.splice(newHIndex, 1)[0];
  state.historyHand.push(newHistoryId);
  let newHistoryCard = getCard(newHistoryId);

  save();
  broadcastHistoryUse(oldCard?.name || "歴史ヒーロー", `を交換し、新しく「${newHistoryCard?.name || '歴史ヒーロー'}」を獲得！ (-10pt)`);
  toast(`🔄 交換完了！「${oldCard?.name || '歴史ヒーロー'}」を破棄し、「${newHistoryCard?.name || '新歴史ヒーロー'}」を獲得！ (-10pt)`);
}

function cardEl(c, isHistory=false){
 let el=document.createElement("div");el.className="card";
 
 let buttonsHtml = `<button class="small action">${isHistory?'使用する':'使用済みにする'}</button>`;
 if(isHistory) {
   buttonsHtml += `<button class="swap-btn swap">交換(-10pt)</button>`;
 }
 buttonsHtml += `<button class="small discard">捨てる${isHistory?'(-10pt)':''}</button>`;

 let displayName = c.name;
 if(isHistory && state.historyStatus[c.id]) {
   displayName += `【${state.historyStatus[c.id]}】`;
 }

 el.innerHTML=`<div><div class="card-head"><span class="card-name">${esc(displayName)}</span><span class="badge ${cls(c.color)}">${esc(c.color)}</span></div><div class="card-desc">${esc(c.desc)}</div></div><div class="card-actions">${buttonsHtml}</div>`;
 
 el.querySelector(".action").onclick=()=>{
   if(isHistory){
     handleHistoryAction(c);
   } else {
     let i=state.hand.indexOf(c.id);
     if(i>=0) state.hand.splice(i,1);
     state.used.push(c.id);
     let myName = document.getElementById("playerNameInput").value.trim() || "自分";
     addLog(`🃏 ${myName} が「${c.name}」を使用済みにしました。`);
     toast("使用済みにしました");
     save();
   }
 };

 if(isHistory){
   el.querySelector(".swap").onclick=()=>{
     swapHistoryCard(c.id);
   };
 }

 el.querySelector(".discard").onclick=()=>{
   let myName = document.getElementById("playerNameInput").value.trim() || "自分";
   if(isHistory){
     if (state.points < 10) {
       toast("ポイントが足りません（10pt以上が必要）");
       return;
     }
     state.points -= 10;
     delete state.historyStatus[c.id];
     let i=state.historyHand.indexOf(c.id);
     if(i>=0) {
       state.historyHand.splice(i,1);
       state.historyDiscarded.push(c.id);
     }
     broadcastHistoryUse(c.name, "を捨てました (-10pt)");
     toast("歴史ヒーローを捨てました (-10pt)");
   } else {
     let i=state.hand.indexOf(c.id);
     if(i>=0) state.hand.splice(i,1);
     state.discarded.push(c.id);
     addLog(`🗑️ ${myName} が「${c.name}」を破棄しました。`);
     toast("カードを捨てました");
   }
   save();
 };
 return el;
}

function renderDeckList(){
  let container=document.getElementById("deckView");container.innerHTML="";
  if(!state.deck.length){
    container.innerHTML='<div class="empty">山札にカードが残っていません。</div>';
    return;
  }
  let counts={};
  state.deck.forEach(id=>{counts[id]=(counts[id]||0)+1;});
  
  Object.keys(counts).forEach(id=>{
    let c=getCard(id); if(!c) return;
    let count=counts[id];
    let el=document.createElement("div");el.className="card";
    el.innerHTML=`<div><div class="card-head"><span class="card-name">${esc(c.name)}</span><span class="badge ${cls(c.color)}">${esc(c.color)}</span></div><div class="card-desc">${esc(c.desc)}</div><div class="copies">山札の残り：${count}枚</div></div><div class="card-actions"><button class="primary get-btn" style="width:100%">手札に入れる</button></div>`;
    el.querySelector(".get-btn").onclick=()=>{
      let idx=state.deck.indexOf(id);
      if(idx>=0){
        state.deck.splice(idx,1);
        state.hand.push(id);
        let myName = document.getElementById("playerNameInput").value.trim() || "自分";
        addLog(`🎴 ${myName} が山札から「${c.name}」を直接手札に入れました。`);
        toast("「"+c.name+"」を手札に追加しました");
        save();
      }
    };
    container.appendChild(el);
  });
}

function render(){
 document.getElementById("pointsValue").textContent=state.points;
 document.getElementById("handCount").textContent=state.hand.length + state.historyHand.length;
 document.getElementById("deckCount").textContent=state.deck.length;
 document.getElementById("usedCount").textContent=state.used.length;
 document.getElementById("discardedCount").textContent=(state.discarded||[]).length;
 document.getElementById("historyDeckCount").textContent=state.historyDeck.length;
 
 let { rank } = getMyRank();
 document.getElementById("myRankDisplay").textContent = `${rank}位`;

 let h=document.getElementById("hand");h.innerHTML="";
 if(!state.hand.length)h.innerHTML='<div class="empty">まだカードがありません。山札から引いてください。</div>';
 let unique=[...new Set(state.hand)];unique.forEach(id=>{let c=getCard(id);if(c)h.appendChild(cardEl(c,false))});

 let hh=document.getElementById("historyHand");hh.innerHTML="";
 if(!state.historyHand.length)hh.innerHTML='<div class="empty">歴史ヒーローを所持していません。</div>';
 let uniqueHistory=[...new Set(state.historyHand)];uniqueHistory.forEach(id=>{let c=getCard(id);if(c)hh.appendChild(cardEl(c,true))});

 renderDeckList();
 renderOtherPlayers();
}

function resetDeckAll(){
 state.deck=[]; state.hand=[]; state.used=[]; state.discarded=[];
 state.cards.forEach(c=>{for(let i=0;i<c.copies;i++)state.deck.push(c.id)});
 save();
 toast("山札をリセットしました");
}

function resetHistoryDeckAll(){
 state.historyDeck=[]; state.historyHand=[]; state.historyDiscarded=[]; state.historyStatus={};
 horiPoints = 1;
 horiWakeStreak = 0;
 state.historyCards.forEach(c=>{for(let i=0;i<c.copies;i++)state.historyDeck.push(c.id)});
 save();
 toast("歴史ヒーローをリセットしました");
}

document.getElementById("drawBtn").onclick=()=>{
 if(!state.deck.length){toast("山札がありません");return}
 let i=Math.floor(Math.random()*state.deck.length),id=state.deck.splice(i,1)[0];state.hand.push(id);save();
 let myName = document.getElementById("playerNameInput").value.trim() || "自分";
 let c = getCard(id);
 addLog(`🎴 ${myName} が山札から「${c?.name||"カード"}」を引きました。`);
 toast("「"+(c?.name||"カード")+"」を引きました！")
};

document.getElementById("drawHistoryBtn").onclick=()=>{
 if(state.points < 10){
   toast("ポイントが足りません（10pt以上が必要）");
   return;
 }
 if(!state.historyDeck.length){toast("歴史ヒーローの山札がありません");return}
 
 state.points -= 10;
 let i=Math.floor(Math.random()*state.historyDeck.length),id=state.historyDeck.splice(i,1)[0];
 state.historyHand.push(id);

 let drawnCard = getCard(id);
 if (drawnCard && drawnCard.name === "堀大輔") {
   state.historyStatus[id] = `堀pt:1`;
 }

 save();
 let myName = document.getElementById("playerNameInput").value.trim() || "自分";
 addLog(`📜 ${myName} が 10pt を消費して歴史ヒーロー「${drawnCard?.name||"カード"}」を獲得！`);
 toast("📜 歴史ヒーロー「"+(drawnCard?.name||"カード")+"」を獲得！ (-10pt)")
};

document.getElementById("resetDeckMainBtn").onclick=()=>{
 if(confirm("手札・使用済み・破棄のカードをすべて戻し、山札を初期状態に戻しますか？")){ 
   resetDeckAll(); 
   let myName = document.getElementById("playerNameInput").value.trim() || "自分";
   addLog(`🔄 ${myName} が山札を全リセットしました。`);
 }
};

document.getElementById("resetHistoryDeckBtn").onclick=()=>{
 if(confirm("所持・破棄した歴史ヒーローを全てリセットし、初期状態の山札に戻しますか？")){ 
   resetHistoryDeckAll(); 
   let myName = document.getElementById("playerNameInput").value.trim() || "自分";
   addLog(`🔄 ${myName} が歴史ヒーロー山札を全リセットしました。`);
 }
};

document.getElementById("resetAllBtn").onclick=()=>{
 if(confirm("【警告】ポイントを0にし、手札・歴史ヒーロー・山札・ターン数をすべてゲーム開始時の状態に戻しますか？\n（※ルームの接続は保持されます）")){
   state.points = 0;
   setTurn(1, false);
   resetDeckAll();
   resetHistoryDeckAll();
   clearLogUI();
   
   let myName = document.getElementById("playerNameInput").value.trim() || "自分";
   addLog(`💥 ${myName} がゲーム状態を一括リセットしました。`);
   
   broadcastState();
   broadcastTurn();
   toast("💥 ゲーム状態を初期化（リセット）しました");
 }
};

function changePoints(amount){
  state.points += amount;
  if(!Number.isFinite(state.points)) state.points=0;
  save();
}

document.getElementById("resetPoints").onclick=()=>{
  state.points=0;
  save();
  let myName = document.getElementById("playerNameInput").value.trim() || "自分";
  addLog(`🔄 ${myName} がポイントを0にリセットしました。`);
  toast("ポイントを0に戻しました");
};

document.getElementById("playerNameInput").oninput=()=>broadcastState();

render();
</script>
