<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🦑 スプラ桃鉄 カード管理</title>
<style>
:root{--bg:#0f1118;--panel:#1b202c;--panel2:#10141d;--border:#30394b;--text:#f7f8fb;--muted:#9ba4b6;--accent:#5865f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.app{max-width:900px;margin:auto;padding:18px 22px 60px}.hero{padding:42px 8px 30px}
h1{font-size:clamp(31px,6vw,50px);margin:0 0 10px;font-weight:800;letter-spacing:-1px}.hero p{margin:0;color:var(--muted);font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;background:var(--panel);border:2px solid var(--border);border-radius:30px;padding:26px}
.stat{background:var(--panel2);border-radius:24px;text-align:center;padding:25px 8px}.stat strong{display:block;font-size:42px}.stat span{color:var(--muted);font-size:17px}
section{background:var(--panel);border:2px solid var(--border);border-radius:30px;margin-top:22px;padding:28px}
.draw-area{display:flex;flex-direction:column;gap:12px}
.draw{width:100%;border:0;border-radius:25px;background:var(--accent);color:#fff;font-weight:800;font-size:22px;padding:25px;cursor:pointer}
.draw:active{transform:translateY(2px)}
.reset-deck-btn{width:100%;border:1px solid var(--border);border-radius:18px;background:#171c27;color:#fff;font-weight:700;font-size:16px;padding:14px;cursor:pointer}
.reset-deck-btn:active{transform:translateY(2px)}
h2{margin:0 0 18px;font-size:27px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:17px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between}
.card-head{display:flex;align-items:center;gap:9px}.card-name{font-size:19px;font-weight:800}.badge{font-size:12px;border-radius:999px;padding:4px 8px;font-weight:800;white-space:nowrap}
.white{background:#eee;color:#222}.black{background:#292d38;color:#fff;border:1px solid #596174}.green{background:#287d51;color:#fff}
.card-desc{color:#b5bdca;font-size:14px;line-height:1.55;margin-top:10px}.copies{color:#8e98ab;font-size:13px;margin-top:10px}.card-actions{display:flex;gap:8px;margin-top:14px}
.small,.primary,.danger{border:1px solid var(--border);background:#171c27;color:#fff;border-radius:12px;padding:9px 11px;cursor:pointer}.primary{background:var(--accent);border:0;font-weight:700}.danger{background:#7c3040;border:0}
.empty{color:var(--muted);padding:10px 0}.filter{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.filter button{white-space:nowrap}
details summary{cursor:pointer;font-weight:800;font-size:20px;list-style:none}.editor{margin-top:20px;display:grid;gap:11px}.editor-row{display:grid;grid-template-columns:1fr 150px 120px;gap:10px}
input,textarea,select{width:100%;background:#10141d;border:1px solid var(--border);color:#fff;border-radius:13px;padding:12px}textarea{min-height:85px;resize:vertical}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:5px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#fff;color:#111;padding:12px 17px;border-radius:14px;font-weight:700;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}

.points-panel{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.points-value{font-size:56px;font-weight:900;line-height:1;word-break:break-all}
.points-label{color:var(--muted);font-size:15px;margin-top:5px}
.point-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:220px}
.point-btn{border:1px solid var(--border);background:#171c27;color:#fff;border-radius:14px;padding:14px 18px;font-weight:800;font-size:18px;cursor:pointer;min-height:48px}
.point-btn.plus{background:var(--accent);border:0}
.point-btn:active{transform:translateY(2px)}
.point-reset{margin-top:12px;width:100%}

@media(max-width:600px){.app{padding:12px 15px 45px}.hero{padding:30px 4px 25px}.hero p{font-size:15px}.stats{padding:15px;gap:9px;border-radius:23px}.stat{padding:20px 5px}.stat strong{font-size:34px}.stat span{font-size:14px}section{padding:21px;border-radius:24px}.draw{font-size:19px}.editor-row{grid-template-columns:1fr 90px 90px}.points-panel{grid-template-columns:1fr}.point-buttons{min-width:0}}
</style>
</head>
<body>
<div class="app">
<header class="hero"><h1>🦑 スプラ桃鉄 カード管理</h1><p>スマホ向け・この端末のブラウザに自動保存</p></header>
<div class="stats"><div class="stat"><strong id="handCount">0</strong><span>手札</span></div><div class="stat"><strong id="deckCount">0</strong><span>山札</span></div><div class="stat"><strong id="usedCount">0</strong><span>使用済み</span></div></div>

<section>
  <h2>⭐ ポイント管理</h2>
  <div class="points-panel">
    <div>
      <div class="points-value" id="pointsValue">0</div>
      <div class="points-label">現在のポイント</div>
    </div>
    <div class="point-buttons">
      <button type="button" class="point-btn plus" id="plus1">＋1</button>
      <button type="button" class="point-btn plus" id="plus10">＋10</button>
      <button type="button" class="point-btn" id="minus1">−1</button>
      <button type="button" class="point-btn" id="minus10">−10</button>
    </div>
  </div>
  <button type="button" class="small point-reset" id="resetPoints">ポイントを0に戻す</button>
</section>

<section>
  <div class="draw-area">
    <button class="draw" id="drawBtn">🎴 山札からカードを引く</button>
    <button class="reset-deck-btn" id="resetDeckMainBtn">🔄 山札をリセット（手札・使用済みを全て山札へ戻す）</button>
  </div>
</section>

<section><h2>🃏 手札</h2><div id="hand" class="cards"></div></section>
<section>
<details><summary>▶ ⚙️ カード・山札を編集</summary>
<div class="editor">
<div class="editor-row"><input id="cardName" placeholder="カード名"><select id="cardColor"><option value="白">白</option><option value="黒">黒</option><option value="緑">緑</option></select><input id="cardCopies" type="number" min="1" value="1" placeholder="枚数"></div>
<textarea id="cardDesc" placeholder="カードの効果・説明"></textarea>
<button class="primary" id="addBtn">カードを追加</button>
<div class="toolbar"><button class="small" id="resetDeck">山札を初期化</button><button class="small" id="returnUsed">使用済みを山札へ戻す</button><button class="danger" id="clearAll">すべてリセット</button></div>
</div>
</details>
</section>
</div><div id="toast" class="toast"></div>
<script>
const KEY="splatoon_momotetsu_card_manager_v2";
const cards=[
["とっかえっこカード","白","自分の持ち点と、他の人の持ち点を入れ替える",1],
["2倍カード","白","次の試合での獲得ポイント×2（マイナスの場合も）",3],
["シャッフルカード","白","全員の持ち点がランダムに入れ替わる",2],
["徳政令カード","白","全員のうち、持ち点がマイナスの人は持ち点が0になる",3],
["たいらのまさかカード","白","全員の持ち点を足して、全員が同じ持ち点になるように分ける",2],
["持ち金ゼロカード","白","自分または選んだ人の持ち点が0円になる（1/2の確率で失敗）",1],
["とりかえしカード","黒","入手した次の試合で±2をクリアできなかった場合、持ち点が半分になる。（持ち点がマイナスの場合は持ち点2倍）",1],
["デビルカード","黒","毎ターン持ち点が1減る（以降の試合で±2をクリアすると消える）",2],
["キングデビルカード","黒","毎ターン持ち点が3減る（以降の試合で±2をクリアすると消える）",1],
["武器エラベルカード","白","次の試合で使える武器を自分で選べる",3],
["武器指定カード","白","選んだ人の武器を選べる",2],
["刀狩りカード","白","誰か一人を選び、持っているカードを一枚奪う",1],
["カード交換カード","白","選んだ人と一枚カードを交換する（カードは選べる）",2],
["リニアカード","白","次の試合での獲得ポイント×10（マイナスの場合も）",1],
["縛りカード","黒","入手した次のターン、縛りルーレットに従う（終わったら捨てる）",1],
["スリの銀次","黒","入手時にルーレットを引いてその分マイナス",1],
["シュレッダーカード","白","自身が持っているカードを一つ捨てることができる",2],
["へっちゃらカード","白","次の試合、マイナスにならなくなる",2],
["武器引き直しカード","白","武器を引き直すことができる",3],
["-20or+20カード","白","1/2の確率で+20か-20になる",2],
["-2倍カード","白","選んだ人の次の試合の獲得ポイントを-2倍にすることができる",1],
["ギア指定カード","白","武器ルーレットを引く前に選んだ人のギアを選ぶことができる",3],
["破壊カード","白","選んだ人のカードを1枚破壊できる",2],
["最下位カード","緑","最下位で使うと何かが起きる（最下位でのみ使用可能）",2],
["牛歩カード","黒","入手した次の試合の最高取得ポイントが1になる",1],
["千載一遇カード","白","ランダムに出た1～9の数字分取得ポイントの条件が緩和される",2]
].map(x=>({id:crypto.randomUUID(),name:x[0],color:x[1],desc:x[2],copies:x[3]}));

function makeInitial(){let deck=[];cards.forEach(c=>{for(let i=0;i<c.copies;i++)deck.push(c.id)});return{cards,deck,hand:[],used:[],points:0}}
let state=load();
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&s.cards){if(typeof s.points!=="number"||!Number.isFinite(s.points))s.points=0;return s}}catch(e){}return makeInitial()}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function getCard(id){return state.cards.find(c=>c.id===id)}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1500)}
function cls(c){return c==="白"?"white":c==="黒"?"black":"green"}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function cardEl(c,where){
 let el=document.createElement("div");el.className="card";
 el.innerHTML=`<div><div class="card-head"><span class="card-name">${esc(c.name)}</span><span class="badge ${cls(c.color)}">${esc(c.color)}</span></div><div class="card-desc">${esc(c.desc)}</div><div class="copies">登録枚数：${c.copies}枚</div></div><div class="card-actions"><button class="small action">${where==="hand"?"使用済みにする":"山札に1枚追加"}</button><button class="small delete">削除</button></div>`;
 el.querySelector(".action").onclick=()=>{if(where==="hand"){let i=state.hand.indexOf(c.id);if(i>=0)state.hand.splice(i,1);state.used.push(c.id);toast("使用済みにしました")}else{state.deck.push(c.id);toast("山札に追加しました")}save()};
 el.querySelector(".delete").onclick=()=>{if(!confirm("「"+c.name+"」を削除しますか？"))return;state.cards=state.cards.filter(x=>x.id!==c.id);state.deck=state.deck.filter(x=>x!==c.id);state.hand=state.hand.filter(x=>x!==c.id);state.used=state.used.filter(x=>x!==c.id);save();toast("削除しました")};
 return el
}
function render(){
 document.getElementById("pointsValue").textContent=state.points;
 document.getElementById("handCount").textContent=state.hand.length;
 document.getElementById("deckCount").textContent=state.deck.length;
 document.getElementById("usedCount").textContent=state.used.length;
 let h=document.getElementById("hand");h.innerHTML="";
 if(!state.hand.length)h.innerHTML='<div class="empty">まだカードがありません。山札から引いてください。</div>';
 let unique=[...new Set(state.hand)];unique.forEach(id=>{let c=getCard(id);if(c)h.appendChild(cardEl(c,"hand"))});
}

function resetDeckAll(){
 state.deck=[];
 state.hand=[];
 state.used=[];
 state.cards.forEach(c=>{for(let i=0;i<c.copies;i++)state.deck.push(c.id)});
 save();
 toast("山札をリセットしました");
}

document.getElementById("drawBtn").onclick=()=>{
 if(!state.deck.length){toast("山札がありません");return}
 let i=Math.floor(Math.random()*state.deck.length),id=state.deck.splice(i,1)[0];state.hand.push(id);save();toast("「"+(getCard(id)?.name||"カード")+"」を引きました！")
};
document.getElementById("addBtn").onclick=()=>{
 let name=document.getElementById("cardName").value.trim(),desc=document.getElementById("cardDesc").value.trim(),color=document.getElementById("cardColor").value,copies=Math.max(1,parseInt(document.getElementById("cardCopies").value)||1);
 if(!name){toast("カード名を入力してください");return}
 let c={id:crypto.randomUUID(),name,color,desc,copies};state.cards.push(c);for(let i=0;i<copies;i++)state.deck.push(c.id);
 document.getElementById("cardName").value="";document.getElementById("cardDesc").value="";save();toast("カードを追加しました")
};

document.getElementById("resetDeckMainBtn").onclick=()=>{
 if(confirm("手札・使用済みのカードをすべて消去し、山札を初期状態に戻しますか？")){
  resetDeckAll();
 }
};
document.getElementById("resetDeck").onclick=()=>resetDeckAll();
document.getElementById("returnUsed").onclick=()=>{state.deck.push(...state.used);state.used=[];save();toast("使用済みを山札へ戻しました")};
document.getElementById("clearAll").onclick=()=>{if(!confirm("登録カードをすべて初期状態に戻しますか？"))return;localStorage.removeItem(KEY);state=load();save();toast("初期化しました")};

function changePoints(amount){
  state.points += amount;
  if(!Number.isFinite(state.points)) state.points=0;
  save();
}
document.getElementById("plus1").onclick=()=>changePoints(1);
document.getElementById("plus10").onclick=()=>changePoints(10);
document.getElementById("minus1").onclick=()=>changePoints(-1);
document.getElementById("minus10").onclick=()=>changePoints(-10);
document.getElementById("resetPoints").onclick=()=>{
  state.points=0;
  save();
  toast("ポイントを0に戻しました");
};

render();
</script>
</body>
</html>
